apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmGlobals:
  chartHome: charts
helmCharts:
  - name: harbor
    releaseName: harbor
    version: 1.1.0
    namespace: harbor
    valuesInline:
      imagePullPolicy: IfNotPresent
      nginx:
        image:
          tag: v2.11.2
      expose:
        type: ingress
        ingress:
          hosts:
            core: harbor.domain

        # I think there should be comments and whitespace in the
        # values content too.
        tls:
          enabled: true
          certSource: secret
          secret:
            secretName: tls-cert
      persistence:
        enabled: true
      externalURL: https://harbor.domain

resources:
  - pvc.yaml
  - cert.yaml