apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harbor
  namespace: harbor
spec:
  secretName: tls-cert
  privateKey:
    rotationPolicy: Always
    algorithm: RSA
    encoding: PKCS1
    size: 4096
  duration: 8760h # 1 Year
  renewBefore: 720h #2 months
  subject:
    organizations:
      - domain
  commonName: domain
  isCA: false
  usages:
    - server auth
    - client auth
  dnsNames:
    - harbor.domain
  issuerRef:
    name: ca-issuer
    kind: ClusterIssuer
---