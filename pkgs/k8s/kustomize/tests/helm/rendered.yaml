apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  namespace: helm-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
        - name: app
          image: ghcr.io/example/demo:2.0.0
---
apiVersion: v1
kind: Service
metadata:
  name: demo
  namespace: helm-demo
spec:
  selector:
    app: demo
  ports:
    - port: 80
      targetPort: 8080
