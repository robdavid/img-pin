apiVersion: apps/v1
kind: Deployment
metadata:
  name: basic
spec:
  selector:
    matchLabels:
      app: basic
  template:
    metadata:
      labels:
        app: basic
    spec:
      containers:
        - name: app
          image: nginx:1.27
---
apiVersion: v1
kind: Service
metadata:
  name: basic
spec:
  selector:
    app: basic
  ports:
    - port: 80
      targetPort: 80
